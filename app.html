"""
Vista Energy (VIST) — Equity Story Dashboard
============================================
A dark-console dashboard that walks a DCF + comparables valuation model, written
for readers who do not work in finance.

Run locally:
    streamlit run app.py

Layout: a fixed left rail selects the section; content is a grid of cards, each
one a single idea with its figure. Repository layout is documented in README.md.
"""

from __future__ import annotations

import pandas as pd
import streamlit as st

from src import charts
from src.data_loader import ModelData, cagr, load_model, resolve_model_path
from src.theme import CUSTOM_CSS, MUTED, NEGATIVE, POSITIVE

st.set_page_config(
    page_title="Vista Energy — Equity Dashboard",
    page_icon="◆",
    layout="wide",
    initial_sidebar_state="expanded",
)
st.markdown(CUSTOM_CSS, unsafe_allow_html=True)

PLOTLY_CONFIG = {"displayModeBar": False, "scrollZoom": False}

#: Left rail. Key = internal id, value = label shown in the nav.
SECTIONS = {
    "overview": "Overview",
    "growth": "Production & growth",
    "margins": "Margins & costs",
    "cash": "Cash & debt",
    "valuation": "Valuation",
    "data": "Underlying data",
}


# --------------------------------------------------------------------------- #
# Data
# --------------------------------------------------------------------------- #


@st.cache_data(show_spinner="Reading the financial model…")
def get_data(path: str) -> ModelData:
    """Parse the workbook once per session (cached on the file path)."""
    return load_model(path)


@st.cache_data(show_spinner=False)
def default_path() -> str:
    """Where the model was found on this deployment."""
    return str(resolve_model_path())


# --------------------------------------------------------------------------- #
# Small HTML helpers — Streamlit has no card primitive, so cards are markup.
# --------------------------------------------------------------------------- #


def card_open(title: str) -> None:
    st.markdown(
        f'<div class="card"><div class="card-head">{title}</div><div class="card-body">',
        unsafe_allow_html=True,
    )


def card_close() -> None:
    st.markdown("</div></div>", unsafe_allow_html=True)


def stat_card(title: str, value: str, unit: str = "", note: str = "") -> None:
    """A card whose body is one headline figure."""
    st.markdown(
        f'<div class="card"><div class="card-head">{title}</div><div class="card-body">'
        f'<div class="stat">{value}<span class="stat-unit">{unit}</span></div>'
        f'<div class="stat-note">{note}</div></div></div>',
        unsafe_allow_html=True,
    )


def rail_card(title: str, done: float, left_label: str, right_label: str, note: str = "") -> None:
    """A card with a progress rail — used for deleveraging and reserve life."""
    pct = max(0.0, min(1.0, done)) * 100
    st.markdown(
        f'<div class="card"><div class="card-head">{title}</div><div class="card-body">'
        f'<div class="rail"><div style="width:{pct:.0f}%"></div></div>'
        f'<div class="rail-labels"><span>{left_label}</span><span>{right_label}</span></div>'
        f'<div class="stat-note">{note}</div></div></div>',
        unsafe_allow_html=True,
    )


def chart_card(title: str, figure, note: str = "") -> None:
    """A card wrapping a Plotly figure, with an optional caption underneath."""
    card_open(title)
    st.plotly_chart(figure, use_container_width=True, config=PLOTLY_CONFIG)
    if note:
        st.markdown(f'<div class="stat-note">{note}</div>', unsafe_allow_html=True)
    card_close()


def explain(text: str) -> None:
    st.markdown(f'<div class="readme">{text}</div>', unsafe_allow_html=True)


def page_head(title: str, subtitle: str, stamp: str = "") -> None:
    st.markdown(
        f'<div class="page-head"><div><h1 class="page-title">{title}</h1>'
        f'<p class="page-sub">{subtitle}</p></div>'
        f'<div class="stamp">{stamp}</div></div>',
        unsafe_allow_html=True,
    )


def window(frame: pd.DataFrame, mode: str) -> pd.DataFrame:
    """Apply the Reported / Projected / Full range segmented control."""
    if mode == "Reported":
        return frame[frame["period"] == "Actual"]
    if mode == "Projected":
        return frame[frame["period"] == "Forecast"]
    return frame


# --------------------------------------------------------------------------- #
# Sidebar: brand, navigation, source
# --------------------------------------------------------------------------- #

if "section" not in st.session_state:
    st.session_state.section = "overview"

with st.sidebar:
    st.markdown(
        '<div class="brand">VISTA <span>ENERGY</span></div>'
        '<div class="brand-sub">NYSE · VIST</div>',
        unsafe_allow_html=True,
    )
    st.markdown('<div class="nav-heading">Sections</div>', unsafe_allow_html=True)

    for key, label in SECTIONS.items():
        active = st.session_state.section == key
        if st.button(label, key=f"nav_{key}", type="primary" if active else "secondary"):
            st.session_state.section = key
            st.rerun()

    st.markdown('<div class="nav-heading">Source</div>', unsafe_allow_html=True)
    model_path = st.text_input(
        "Model file", value=default_path(), label_visibility="collapsed",
        help="Path to the .xlsx workbook containing the 'Outputs' sheet.",
    )
    st.caption(
        "Reported figures from Vista's published statements. Projections are the "
        "author's own estimates — not investment advice."
    )

try:
    data = get_data(model_path)
except Exception as error:  # noqa: BLE001 — surfaced to the user on purpose
    st.error(f"Could not read the model. {error}")
    st.stop()

LAST_ACTUAL = data.last_actual_year
FIRST_FORECAST = data.first_forecast_year
FINAL_YEAR = data.years[-1]

production = data.series("Production")
fcf = data.series("Free Cash Flow (levered)")
prod_start = data.value("Production", LAST_ACTUAL)
prod_end = data.value("Production", FINAL_YEAR)
prod_cagr = cagr(prod_start, prod_end, int(FINAL_YEAR[:4]) - int(LAST_ACTUAL[:4]))

positive = fcf[(fcf["value"] > 0) & (fcf["year"].str.endswith("E"))]
turnaround = positive["year"].iloc[0] if not positive.empty else FIRST_FORECAST

price = data.valuation["share_price_current"]
target = data.valuation["blended_price_target"]
upside = data.valuation["upside_downside"]
debt_now = data.value("Net debt", LAST_ACTUAL)
debt_end = data.value("Net debt", FINAL_YEAR)

section = st.session_state.section


# --------------------------------------------------------------------------- #
# Overview — the card grid
# --------------------------------------------------------------------------- #

if section == "overview":
    page_head(
        "Equity Dashboard",
        "Vista is the largest independent oil producer in Argentina's Vaca Muerta shale. "
        "It spent three years drilling heavily; this dashboard follows the money through "
        "that build-out and out the other side.",
        f"{LAST_ACTUAL[:4]} reported · {FINAL_YEAR[:4]} projected",
    )

    row = st.columns([1, 1, 1.35], gap="medium")
    with row[0]:
        chart_card(
            f"Production mix · {LAST_ACTUAL[:4]}",
            charts.production_donut(
                data.value("Oil production", LAST_ACTUAL),
                data.value("Gas & NGL production", LAST_ACTUAL),
                LAST_ACTUAL,
            ),
        )
    with row[1]:
        change = data.value("Revenue", FINAL_YEAR) / data.value("Revenue", LAST_ACTUAL) - 1
        chart_card(
            "Revenue, then and later",
            charts.compare_pair(
                (LAST_ACTUAL, FINAL_YEAR),
                (data.value("Revenue", LAST_ACTUAL), data.value("Revenue", FINAL_YEAR)),
            ),
            f'<span class="up">▲ {change:.0%}</span> projected growth in annual revenue, '
            f"in millions of dollars.",
        )
    with row[2]:
        chart_card(
            "Production trajectory",
            charts.trajectory(production, "boe/d"),
            f"Output compounds at <b>{prod_cagr:.1%}</b> a year from {LAST_ACTUAL[:4]} "
            f"to {FINAL_YEAR[:4]}.",
        )

    row = st.columns([1, 1, 1.35], gap="medium")
    with row[0]:
        chart_card(
            f"Operating margin · {FIRST_FORECAST[:4]}",
            charts.margin_gauge(data.value("EBITDA Margin", FIRST_FORECAST), "of every sales dollar"),
        )
    with row[1]:
        stat_card(
            "Cost to lift one barrel",
            f"${data.value('Lifting cost', LAST_ACTUAL):.2f}",
            "/ boe",
            f"All-in, including royalties and transport: "
            f"<b>${data.value('Total cost per boe', LAST_ACTUAL):.2f}</b> against a realised "
            f"price of <b>${data.value('Realized oil price', LAST_ACTUAL):.2f}</b> per barrel.",
        )
        repaid = 1 - max(debt_end, 0) / debt_now if debt_now else 1.0
        rail_card(
            "Debt repayment path",
            repaid,
            f"{LAST_ACTUAL[:4]}: ${debt_now:,.0f}M owed",
            f"{FINAL_YEAR[:4]}: " + (f"${debt_end:,.0f}M" if debt_end > 0 else "net cash"),
            f"Leverage falls from <b>{data.value('Net Debt / EBITDA', LAST_ACTUAL):.1f}x</b> "
            f"to <b>{data.value('Net Debt / EBITDA', FINAL_YEAR):.1f}x</b> years of earnings.",
        )
    with row[2]:
        chart_card(
            "Free cash flow",
            charts.trajectory(fcf, "$M", fill=True),
            f"Deeply negative during the drilling push, turning positive in "
            f"<b>{turnaround[:4]}</b> as capital spending levels off.",
        )

    row = st.columns([1, 1, 1.35], gap="medium")
    with row[0]:
        stat_card(
            "Trading at",
            f"${price:,.2f}",
            "/ share",
            f"Market capitalisation <b>${data.valuation['market_cap']:,.0f}M</b> · "
            f"enterprise value <b>${data.valuation['enterprise_value']:,.0f}M</b>.",
        )
    with row[1]:
        arrow = "▲" if upside >= 0 else "▼"
        css = "up" if upside >= 0 else "down"
        stat_card(
            "Blended price target",
            f"${target:,.2f}",
            "/ share",
            f'<span class="{css}">{arrow} {upside:+.1%}</span> against the current price. '
            f"Average of a cash-flow model and a peer-multiple approach.",
        )
    with row[2]:
        chart_card(
            "Value per share by method",
            charts.price_targets(
                price,
                {
                    "Cash-flow (DCF)": data.valuation["dcf_price_target"],
                    "Peer multiple": data.valuation["comps_price_target"],
                    "Blended": data.valuation["blended_price_target"],
                },
            ),
        )


# --------------------------------------------------------------------------- #
# Growth
# --------------------------------------------------------------------------- #

elif section == "growth":
    page_head(
        "Production & growth",
        "How many barrels come out of the ground each day, and how that turns into revenue.",
    )
    mode = st.radio("Range", ["Reported", "Projected", "Full range"], index=2,
                    horizontal=True, label_visibility="collapsed")

    explain(
        "Output is measured in <b>barrels of oil equivalent per day (boe/d)</b> — gas is "
        "converted into the amount of oil holding the same energy, so everything can be added "
        f"up. Production more than doubled between 2022 and {LAST_ACTUAL[:4]}, and is projected "
        f"to reach {prod_end:,.0f} boe/d by {FINAL_YEAR[:4]}."
    )
    chart_card(
        "Daily production, split by product",
        charts.production_mix(
            window(data.series("Oil production"), mode),
            window(data.series("Gas & NGL production"), mode),
            window(production, mode),
        ),
        "Bars stack to the daily total. The pale line is growth against the prior year.",
    )

    left, right = st.columns([1.6, 1], gap="medium")
    with left:
        chart_card(
            "Revenue and operating margin",
            charts.revenue_and_margin(
                window(data.series("Revenue"), mode), window(data.series("EBITDA Margin"), mode)
            ),
        )
    with right:
        card_open("Why revenue outruns production")
        st.markdown(
            f"""
            Revenue depends on two things: **how much you sell** and **the price you get**.

            - Volumes rise about **{prod_cagr:.0%} a year** through {FINAL_YEAR[:4]}.
            - The crude is light shale oil priced off Brent, so revenue moves with the global
              oil price even when production is flat.
            - Most costs are fixed per well, so extra barrels arrive at a high margin — which is
              why the margin line stays flat instead of falling as the company grows.
            """
        )
        card_close()


# --------------------------------------------------------------------------- #
# Margins
# --------------------------------------------------------------------------- #

elif section == "margins":
    page_head(
        "Margins & costs",
        "What a barrel costs to produce, what it sells for, and how much survives to the bottom line.",
    )
    explain(
        "This is the heart of the investment case. The cost to pull a barrel out of the ground — "
        f"the <b>lifting cost</b> — is roughly <b>${data.value('Lifting cost', LAST_ACTUAL):.2f}</b>, "
        "among the lowest in the industry. Add royalties, taxes and transport and the all-in cost "
        f"is about <b>${data.value('Total cost per boe', LAST_ACTUAL):.2f} per barrel</b>, against "
        f"a realised price near <b>${data.value('Realized oil price', LAST_ACTUAL):.2f}</b>."
    )

    top = st.columns([1, 1, 1], gap="medium")
    with top[0]:
        stat_card("Lifting cost", f"${data.value('Lifting cost', LAST_ACTUAL):.2f}", "/ boe",
                  f"Falling to <b>${data.value('Lifting cost', FINAL_YEAR):.2f}</b> by "
                  f"{FINAL_YEAR[:4]} as wells get more productive.")
    with top[1]:
        stat_card("All-in cost", f"${data.value('Total cost per boe', LAST_ACTUAL):.2f}", "/ boe",
                  "Includes royalties, export duties and selling expenses.")
    with top[2]:
        stat_card("Profit per barrel", f"${data.value('EBITDA per boe', LAST_ACTUAL):.2f}", "/ boe",
                  f"Projected at <b>${data.value('EBITDA per boe', FINAL_YEAR):.2f}</b> "
                  f"in {FINAL_YEAR[:4]}.")

    chart_card(
        "What a barrel earns versus what it costs",
        charts.unit_economics(data.series("EBITDA per boe"), data.series("Total cost per boe")),
        "The gap between the bars and the pale line is the profit on every barrel produced.",
    )
    chart_card(
        "Where each sales dollar goes",
        charts.margin_ladder(
            {
                "Gross margin": data.series("Gross Margin"),
                "EBITDA margin": data.series("EBITDA Margin"),
                "Operating margin (EBIT)": data.series("EBIT Margin"),
                "Net profit margin": data.series("Net Income Margin"),
            }
        ),
        "Each line peels back one layer of cost: production, then operating, then the charge "
        "for wells wearing out, then interest and tax.",
    )


# --------------------------------------------------------------------------- #
# Cash & debt
# --------------------------------------------------------------------------- #

elif section == "cash":
    page_head(
        "Cash & debt",
        "The transition from spending phase to harvest phase, and how the debt gets repaid.",
    )
    explain(
        "<b>Free cash flow</b> is the cash left after running the business and drilling new wells "
        "— the money genuinely available to repay debt or return to shareholders. It was deeply "
        f"negative in {LAST_ACTUAL[:4]} because Vista invested far more than it earned. As "
        f"drilling spend levels off while production keeps rising, it turns positive in "
        f"<b>{turnaround[:4]}</b>."
    )

    top = st.columns([1, 1, 1], gap="medium")
    with top[0]:
        stat_card("Free cash flow", f"${data.value('Free Cash Flow (levered)', LAST_ACTUAL):,.0f}M",
                  f"in {LAST_ACTUAL[:4]}",
                  f"Projected at <b>${data.value('Free Cash Flow (levered)', FINAL_YEAR):,.0f}M</b> "
                  f"by {FINAL_YEAR[:4]}.")
    with top[1]:
        stat_card("Capital spending", f"${abs(data.value('of which CapEx', FIRST_FORECAST)):,.0f}M",
                  f"in {FIRST_FORECAST[:4]}",
                  f"Tapering to <b>${abs(data.value('of which CapEx', FINAL_YEAR)):,.0f}M</b> "
                  f"as the field matures.")
    with top[2]:
        stat_card("Return on capital", f"{data.value('ROACE', LAST_ACTUAL):.1%}", "ROACE",
                  "Profit earned on every dollar of capital employed in the business.")

    chart_card(
        "Cash in, cash out, and what is left over",
        charts.cash_flow_story(fcf, data.series("of which CapEx"), data.series("Cash from Operations")),
        "Bars above zero are cash generated by operations; bars below are cash invested in new "
        "wells. The line is the net result.",
    )
    chart_card(
        "Net debt and leverage",
        charts.leverage(data.series("Net debt"), data.series("Net Debt / EBITDA")),
        "<b>Net debt ÷ EBITDA</b> answers one question: how many years of earnings would it take "
        "to repay everything owed? Under 2x is generally comfortable for an energy producer.",
    )


# --------------------------------------------------------------------------- #
# Valuation
# --------------------------------------------------------------------------- #

elif section == "valuation":
    page_head(
        "Valuation",
        "Two independent methods, and a grid showing how the answer moves with the assumptions.",
        f"Trading at ${price:,.2f}",
    )
    explain(
        "A <b>discounted cash flow (DCF)</b> adds up all the cash the business is expected to "
        "produce and converts it into today's money, because a dollar received in 2030 is worth "
        "less than a dollar today. A <b>comparables</b> approach asks what investors currently pay "
        "for similar producers and applies that to Vista's earnings."
    )

    left, right = st.columns([1.5, 1], gap="medium")
    with left:
        chart_card("From future cash flows to equity value", charts.dcf_waterfall(data.dcf))
    with right:
        card_open("Key assumptions")
        st.markdown(
            f"""
            | Input | Value |
            |---|---|
            | Discount rate (WACC) | {data.dcf['wacc']:.1%} |
            | Exit multiple (EV/EBITDA) | {data.dcf.get('exit_multiple_ev_ebitda', float('nan')):.1f}x |
            | Peer multiple applied | {data.dcf.get('comps_ev_ebitda_mult', float('nan')):.1f}x |
            | Shares outstanding | {data.valuation['shares_outstanding']:,.1f} M |
            | EV / EBITDA ({FIRST_FORECAST[:4]}) | {data.valuation['ev_ebitda_2026e']:.1f}x |
            """
        )
        card_close()

    st.markdown("### Test the assumptions yourself")
    explain(
        "Any valuation is only as good as its inputs. The two that matter most are the "
        "<b>oil price</b> and the <b>discount rate</b> — the return investors demand for taking "
        "the risk. Pick a combination to see what a share would be worth."
    )

    grid = data.sensitivity
    a, b, c = st.columns([1, 1, 1.4], gap="medium")
    with a:
        brent = st.select_slider(
            "Brent oil price ($/barrel)", options=list(grid.index),
            value=float(grid.index[len(grid.index) // 2]), format_func=lambda v: f"${v:,.0f}",
        )
    with b:
        wacc_options = list(grid.columns)
        wacc = st.select_slider(
            "Discount rate (WACC)", options=wacc_options,
            value=float(data.dcf["wacc"]) if data.dcf["wacc"] in wacc_options
            else wacc_options[len(wacc_options) // 2],
            format_func=lambda v: f"{v:.0%}",
        )
    implied = float(grid.loc[brent, wacc])
    move = implied / price - 1
    with c:
        css = "up" if move >= 0 else "down"
        arrow = "▲" if move >= 0 else "▼"
        stat_card(
            "Implied value per share", f"${implied:,.2f}", "/ share",
            f'<span class="{css}">{arrow} {move:+.1%}</span> against today\'s ${price:,.2f}, '
            f"at ${brent:,.0f} oil and a {wacc:.0%} discount rate.",
        )

    chart_card(
        "Value per share across assumptions",
        charts.sensitivity_heatmap(grid, price),
        "Brighter cells mean a higher value per share. Read across for a tougher discount rate, "
        "down for a stronger oil price.",
    )


# --------------------------------------------------------------------------- #
# Data
# --------------------------------------------------------------------------- #

elif section == "data":
    page_head("Underlying data", "Every figure behind the charts, exactly as parsed from the model.")

    sections = sorted(data.tidy["section"].unique())
    chosen = st.multiselect("Filter by statement", sections, default=sections)
    view = data.tidy[data.tidy["section"].isin(chosen)]

    wide = view.pivot_table(
        index=["section", "metric", "unit"], columns="year", values="value", sort=False
    ).reindex(columns=data.years)
    st.dataframe(wide.style.format("{:,.2f}", na_rep="—"), use_container_width=True, height=560)

    st.download_button(
        "Download tidy dataset (CSV)",
        data=data.tidy.to_csv(index=False).encode("utf-8"),
        file_name="vista_model_output.csv",
        mime="text/csv",
    )

    if data.notes:
        st.markdown("#### Source notes")
        for note in data.notes:
            st.caption(note)


# --------------------------------------------------------------------------- #
# Footer
# --------------------------------------------------------------------------- #

"""
data_loader.py
--------------
Reads the 'Outputs' sheet of the Vista Energy integrated financial model and
turns it into tidy, chart-ready pandas objects.

Design notes
------------
* The Excel sheet is a *human-readable* report: sections stacked vertically,
  metric labels in column B, units in column C, and one column per fiscal year.
  Instead of hard-coding cell addresses (which break the moment a row is
  inserted), this module anchors on **text labels** and on the year header rows
  (e.g. "2022A", "2026E"). That makes the loader resilient to model edits.
* Every public function returns plain pandas objects so the Streamlit layer
  stays free of parsing logic.
* Nothing here imports Streamlit — the module can be unit-tested or reused in a
  notebook.
"""

from __future__ import annotations

import re
from dataclasses import dataclass, field
from pathlib import Path
from typing import Dict, List, Optional

import pandas as pd
from openpyxl import load_workbook
from openpyxl.worksheet.worksheet import Worksheet

# --------------------------------------------------------------------------- #
# Configuration
# --------------------------------------------------------------------------- #

#: Preferred location of the model, relative to the repository root.
DEFAULT_MODEL_PATH = Path(__file__).resolve().parents[1] / "data" / "vista_financial_model.xlsx"

#: Folders searched, in order, when the preferred file is not present.
SEARCH_DIRS = [
    Path(__file__).resolve().parents[1] / "data",
    Path(__file__).resolve().parents[1],
]


def resolve_model_path(path: str | Path | None = None) -> Path:
    """
    Locate the model workbook.

    Order of preference:
      1. An explicit path passed by the caller (or typed in the sidebar).
      2. ``data/vista_financial_model.xlsx``.
      3. The first ``.xlsx`` found in ``data/``, then in the repository root.

    Step 3 exists so the app keeps working when the workbook is committed under
    its original name — which usually contains spaces and punctuation that are
    awkward to hard-code. Excel's temporary ``~$`` lock files are skipped.
    """
    if path:
        candidate = Path(path)
        if candidate.exists():
            return candidate
        raise FileNotFoundError(f"Model file not found at {candidate}.")

    if DEFAULT_MODEL_PATH.exists():
        return DEFAULT_MODEL_PATH

    for directory in SEARCH_DIRS:
        if not directory.is_dir():
            continue
        matches = sorted(
            item for item in directory.glob("*.xlsx") if not item.name.startswith("~$")
        )
        if matches:
            return matches[0]

    raise FileNotFoundError(
        "No .xlsx model found. Place the workbook in data/ or pass an explicit path."
    )

#: Name of the sheet holding the summarised model outputs.
OUTPUT_SHEET = "Outputs"

#: A fiscal-year header looks like "2024A" (actual) or "2027E" (estimate).
YEAR_PATTERN = re.compile(r"^(19|20)\d{2}[AE]$")

#: Section titles written in ALL CAPS in column B of the Outputs sheet.
SECTION_TITLES = {
    "OPERATIONAL METRICS",
    "INCOME STATEMENT",
    "CASH FLOW STATEMENT",
    "BALANCE SHEET SUMMARY",
    "VALUATION SUMMARY",
    "SENSITIVITY ANALYSIS",
    "DCF CALCULATION",
    "SENSITIVITY ENGINE (BRENT × WACC)",
}


# --------------------------------------------------------------------------- #
# Container
# --------------------------------------------------------------------------- #


@dataclass
class ModelData:
    """Everything the dashboard needs, parsed once and cached."""

    #: Tidy long-format table: section | metric | unit | year | period | value
    tidy: pd.DataFrame = field(default_factory=pd.DataFrame)
    #: Single-value valuation figures (share price, EV, price targets, ...).
    valuation: Dict[str, float] = field(default_factory=dict)
    #: DCF build-up (WACC, PV of FCF, terminal value, equity value, ...).
    dcf: Dict[str, float] = field(default_factory=dict)
    #: Sensitivity grid — index = Brent ($/bbl), columns = WACC (fraction).
    sensitivity: pd.DataFrame = field(default_factory=pd.DataFrame)
    #: Ordered fiscal-year labels, e.g. ["2022A", ..., "2030E"].
    years: List[str] = field(default_factory=list)
    #: Free-text footnotes found in the sheet (sources, methodology).
    notes: List[str] = field(default_factory=list)

    # -- convenience accessors ---------------------------------------------- #

    def series(self, metric: str) -> pd.DataFrame:
        """Return the rows of `tidy` for one metric, ordered by year."""
        out = self.tidy[self.tidy["metric"].str.lower() == metric.lower()]
        if out.empty:
            raise KeyError(f"Metric not found in the model: {metric!r}")
        return out.sort_values("year_num").reset_index(drop=True)

    def value(self, metric: str, year: str) -> float:
        """Return a single metric/year figure (e.g. 'Revenue', '2026E')."""
        rows = self.series(metric)
        hit = rows[rows["year"] == year]
        if hit.empty:
            raise KeyError(f"No value for {metric!r} in {year!r}")
        return float(hit["value"].iloc[0])

    @property
    def last_actual_year(self) -> str:
        """The most recent reported (non-forecast) fiscal year."""
        actuals = [y for y in self.years if y.endswith("A")]
        return actuals[-1]

    @property
    def first_forecast_year(self) -> str:
        forecasts = [y for y in self.years if y.endswith("E")]
        return forecasts[0]


# --------------------------------------------------------------------------- #
# Low-level helpers
# --------------------------------------------------------------------------- #


def _cell(ws: Worksheet, row: int, col: int):
    return ws.cell(row=row, column=col).value


def _find_label_row(ws: Worksheet, text: str, col: int = 2) -> Optional[int]:
    """Return the first row whose column `col` starts with `text` (case-insensitive)."""
    needle = text.strip().lower()
    for row in range(1, ws.max_row + 1):
        value = _cell(ws, row, col)
        if isinstance(value, str) and value.strip().lower().startswith(needle):
            return row
    return None


def _year_columns(ws: Worksheet, row: int) -> Dict[int, str]:
    """Map column index -> fiscal-year label for a header row such as row 5."""
    mapping: Dict[int, str] = {}
    for col in range(1, ws.max_column + 1):
        value = _cell(ws, row, col)
        if isinstance(value, str) and YEAR_PATTERN.match(value.strip()):
            mapping[col] = value.strip()
    return mapping


def _is_number(value) -> bool:
    return isinstance(value, (int, float)) and not isinstance(value, bool)


# --------------------------------------------------------------------------- #
# Section parsers
# --------------------------------------------------------------------------- #


def _parse_statements(ws: Worksheet) -> tuple[pd.DataFrame, List[str], List[str]]:
    """
    Walk the sheet top-to-bottom and collect every `metric x year` figure that
    sits under a year header row. Returns (tidy dataframe, year labels, notes).
    """
    records: List[dict] = []
    notes: List[str] = []
    year_map: Dict[int, str] = {}
    section = "GENERAL"
    all_years: List[str] = []

    for row in range(1, ws.max_row + 1):
        label = _cell(ws, row, 2)

        # 1. Section header (ALL CAPS, no unit next to it).
        if isinstance(label, str) and label.strip().upper() in SECTION_TITLES:
            section = label.strip().upper()
            # Stop before the blocks that need bespoke parsing.
            if section in {"SENSITIVITY ANALYSIS", "DCF CALCULATION"} or section.startswith(
                "SENSITIVITY ENGINE"
            ):
                break
            continue

        # 2. Year header row -> refresh the column map used by the rows below.
        header = _year_columns(ws, row)
        if header:
            year_map = header
            for year in header.values():
                if year not in all_years:
                    all_years.append(year)
            continue

        if not isinstance(label, str) or not year_map:
            continue

        unit = _cell(ws, row, 3)
        values = {col: _cell(ws, row, col) for col in year_map}

        # 3. A row with no numbers under the year columns is a footnote.
        if not any(_is_number(v) for v in values.values()):
            if len(label.strip()) > 40:  # heuristic: prose, not an empty metric row
                notes.append(label.strip())
            continue

        metric = label.strip()
        for col, year in year_map.items():
            raw = values[col]
            if not _is_number(raw):
                continue
            records.append(
                {
                    "section": section,
                    "metric": metric,
                    "unit": (unit or "").strip() if isinstance(unit, str) else "",
                    "year": year,
                    "year_num": int(year[:4]),
                    "period": "Actual" if year.endswith("A") else "Forecast",
                    "value": float(raw),
                }
            )

    tidy = pd.DataFrame.from_records(records)
    # The valuation block holds one-off figures parked in a single column; they
    # are not a time series, so they live in `ModelData.valuation` instead.
    if not tidy.empty:
        tidy = tidy[tidy["section"] != "VALUATION SUMMARY"].reset_index(drop=True)
    all_years.sort(key=lambda y: int(y[:4]))
    return tidy, all_years, notes


def _parse_valuation(ws: Worksheet) -> Dict[str, float]:
    """
    The VALUATION SUMMARY block holds single figures in one column (K).
    Values are keyed by their label, lower-cased and snake-cased.
    """
    start = _find_label_row(ws, "VALUATION SUMMARY")
    if start is None:
        return {}

    out: Dict[str, float] = {}
    for row in range(start + 1, start + 25):
        label = _cell(ws, row, 2)
        if not isinstance(label, str):
            continue
        if label.strip().upper() in SECTION_TITLES and row != start:
            break
        # Scan the row for the first numeric value to the right of the unit column.
        for col in range(4, ws.max_column + 1):
            raw = _cell(ws, row, col)
            if _is_number(raw):
                out[_slug(label)] = float(raw)
                break
    return out


def _parse_dcf(ws: Worksheet) -> Dict[str, float]:
    """Parse the DCF build-up block (WACC, PVs, terminal value, value/share)."""
    start = _find_label_row(ws, "DCF CALCULATION")
    if start is None:
        return {}

    out: Dict[str, float] = {}
    for row in range(start + 1, min(start + 25, ws.max_row + 1)):
        label = _cell(ws, row, 2)
        if not isinstance(label, str):
            continue
        for col in range(3, ws.max_column + 1):
            raw = _cell(ws, row, col)
            if _is_number(raw):
                out[_slug(label)] = float(raw)
                break
        # Assumption pairs written side by side on the same row, e.g.
        # "WACC | 13% | ... | Exit multiple (EV/EBITDA) | 4.5x". The value is the
        # next numeric cell to the right of the label, allowing for blank spacers.
        for col in range(3, ws.max_column + 1):
            side_label = _cell(ws, row, col)
            if not isinstance(side_label, str) or not side_label.strip():
                continue
            for look in range(col + 1, min(col + 4, ws.max_column + 1)):
                side_value = _cell(ws, row, look)
                if _is_number(side_value):
                    out[_slug(side_label)] = float(side_value)
                    break

    # Yearly unlevered FCF, useful for the valuation waterfall.
    ufcf_row = _find_label_row(ws, "Unlevered Free Cash Flow")
    if ufcf_row:
        header = _year_columns(ws, ufcf_row - 1)
        out["ufcf_by_year"] = {  # type: ignore[assignment]
            year: float(_cell(ws, ufcf_row, col))
            for col, year in header.items()
            if _is_number(_cell(ws, ufcf_row, col))
        }
    return out


def _parse_sensitivity(ws: Worksheet) -> pd.DataFrame:
    """
    Parse the Brent x WACC grid into a DataFrame:
        index   -> Brent price ($/bbl)
        columns -> WACC (as a fraction, e.g. 0.13)
        values  -> implied value per share ($)
    """
    start = _find_label_row(ws, "SENSITIVITY ANALYSIS")
    if start is None:
        return pd.DataFrame()

    # The corner cell of the grid is the first row below the title that has
    # numbers running across it.
    header_row = None
    for row in range(start + 1, start + 8):
        across = [_cell(ws, row, col) for col in range(3, 9)]
        if sum(_is_number(v) for v in across) >= 3:
            header_row = row
            break
    if header_row is None:
        return pd.DataFrame()

    wacc_cols = {
        col: float(_cell(ws, header_row, col))
        for col in range(3, ws.max_column + 1)
        if _is_number(_cell(ws, header_row, col))
    }

    data: Dict[float, Dict[float, float]] = {}
    for row in range(header_row + 1, header_row + 20):
        brent = _cell(ws, row, 2)
        if not _is_number(brent):
            break
        data[float(brent)] = {
            wacc: float(_cell(ws, row, col))
            for col, wacc in wacc_cols.items()
            if _is_number(_cell(ws, row, col))
        }

    grid = pd.DataFrame(data).T.sort_index()
    grid.index.name = "Brent ($/bbl)"
    grid.columns.name = "WACC"
    return grid


def _slug(label: str) -> str:
    """'DCF price target' -> 'dcf_price_target'."""
    clean = re.sub(r"[^\w\s]", " ", label.strip().lower())
    return re.sub(r"\s+", "_", clean).strip("_")


# --------------------------------------------------------------------------- #
# Public API
# --------------------------------------------------------------------------- #


def load_model(path: str | Path | None = None, sheet: str = OUTPUT_SHEET) -> ModelData:
    """
    Read the model workbook and return a fully parsed :class:`ModelData`.

    Parameters
    ----------
    path : str | Path | None
        Path to the .xlsx model. When omitted, :func:`resolve_model_path` looks
        for ``data/vista_financial_model.xlsx`` and then for any other workbook
        in ``data/`` or in the repository root.
    sheet : str
        Sheet name holding the summary outputs. Defaults to ``"Outputs"``.

    Notes
    -----
    ``data_only=True`` reads the *cached values* of the formulas, so the workbook
    must have been opened and saved by Excel/LibreOffice at least once after the
    last edit — otherwise formula cells come back empty.
    """
    path = resolve_model_path(path)
    workbook = load_workbook(path, data_only=True, read_only=False)
    if sheet not in workbook.sheetnames:
        raise KeyError(
            f"Sheet {sheet!r} not found. Available sheets: {', '.join(workbook.sheetnames)}"
        )
    ws = workbook[sheet]

    tidy, years, notes = _parse_statements(ws)
    if tidy.empty:
        raise ValueError(
            "No numeric data parsed. Open the workbook in Excel, save it, and try again "
            "(formula results must be cached in the file)."
        )

    data = ModelData(
        tidy=tidy,
        valuation=_parse_valuation(ws),
        dcf=_parse_dcf(ws),
        sensitivity=_parse_sensitivity(ws),
        years=years,
        notes=notes,
    )
    workbook.close()
    return data


def yoy_growth(frame: pd.DataFrame) -> pd.DataFrame:
    """Add a `yoy` column (year-on-year % change) to a single-metric frame."""
    out = frame.sort_values("year_num").copy()
    out["yoy"] = out["value"].pct_change()
    return out


def cagr(start_value: float, end_value: float, periods: int) -> float:
    """Compound annual growth rate. `periods` = number of years between the two."""
    if start_value <= 0 or periods <= 0:
        return float("nan")
    return (end_value / start_value) ** (1 / periods) - 1

"""
theme.py
--------
Single source of truth for the visual identity.

Direction: dark console. The page is a deep aubergine field, content sits on
raised cards, and violet is the only colour that carries data - so brightness

Palette (Vista Energy corporate purple, adapted for a dark surface):
    CANVAS    #150B26  page background, top of the gradient

    TEXT      #F3EEFA  headlines and figures
    MUTED     #9D8FB8  labels, captions, axis text

Semantics are the only exception to the purple rule: mint for cash generated,

Encoding rule applied across every chart:
    solid   = reported / audited history

"""

    [0.00, "#1E1038"],

# --------------------------------------------------------------------------- #
# Plotly template

def plotly_layout(height: int = 300, **overrides) -> dict:
    """Shared layout: transparent background so figures sit inside the cards."""
    layout = dict(
        height=height,
        font=dict(family=FONT_BODY, size=12, color=MUTED),
        margin=dict(l=8, r=12, t=18, b=30),
        paper_bgcolor="rgba(0,0,0,0)",
        plot_bgcolor="rgba(0,0,0,0)",
        hoverlabel=dict(
            bgcolor=SURFACE_2,
            bordercolor=VIOLET,
            font=dict(family=FONT_BODY, size=12, color=TEXT),
        ),
        hovermode="x unified",
        legend=dict(
            orientation="h", yanchor="bottom", y=1.0, xanchor="left", x=0,
            font=dict(size=11, color=MUTED), bgcolor="rgba(0,0,0,0)",
        ),
        xaxis=dict(showgrid=False, linecolor=LINE, tickfont=dict(color=MUTED, size=11),
                   ticks="outside", tickcolor=LINE),
        yaxis=dict(showgrid=True, gridcolor=GRID, zerolinecolor=LINE,
                   linecolor="rgba(0,0,0,0)", tickfont=dict(color=MUTED, size=11)),
    )
    layout.update(overrides)
    return layout

"""
charts.py
---------
Every Plotly figure lives here so app.py stays a layout file.

Figures are drawn on a transparent background: the card behind them supplies the
surface colour, exactly as in a dark console UI. Two conventions hold throughout:

  1. Reported years are solid violet; projected years are hatched and sit on a
     lighter band, so fact and forecast are never confused.
  2. Hover text is written in full sentences with units, because the reader may
     not know oil and gas reporting conventions.
"""

from __future__ import annotations

from typing import Sequence

import pandas as pd
import plotly.graph_objects as go

from .theme import (
    CANVAS,
    GRID,
    LINE,
    MUTED,
    NEGATIVE,
    POSITIVE,
    PURPLE_SCALE,
    SURFACE_2,
    TEXT,
    VIOLET,
    VIOLET_DEEP,
    VIOLET_GLOW,
    VIOLET_LIGHT,
    plotly_layout,
)

#: Hatch applied to every projected bar.
_HATCH = dict(size=6, solidity=0.22, fgcolor=CANVAS)


def _pattern(periods: Sequence[str]) -> dict:
    """Marker pattern with the hatch switched on only for forecast bars."""
    return dict(shape=["" if p == "Actual" else "/" for p in periods], **_HATCH)


def _colours(periods: Sequence[str], actual: str = VIOLET, forecast: str = VIOLET_DEEP) -> list[str]:
    return [actual if p == "Actual" else forecast for p in periods]


def _forecast_band(fig: go.Figure, years: Sequence[str], label: bool = True) -> go.Figure:
    """Shade the projected years and mark where reported history stops."""
    forecasts = [y for y in years if y.endswith("E")]
    if not forecasts:
        return fig

    boundary = list(years).index(forecasts[0]) - 0.5
    fig.add_vrect(
        x0=boundary, x1=len(years) - 0.5,
        fillcolor="rgba(169,107,238,0.07)", layer="below", line_width=0,
    )
    fig.add_vline(x=boundary, line_width=1, line_dash="dot", line_color=VIOLET_DEEP)
    if label:
        fig.add_annotation(
            x=boundary, y=1.0, yref="paper", text="PROJECTED", showarrow=False,
            xanchor="left", yanchor="bottom",
            font=dict(size=9, color=VIOLET, family="'Space Grotesk', sans-serif"),
        )
    return fig

def production_donut(oil: float, gas: float, year_label: str) -> go.Figure:
    """Oil vs gas split, with the daily total in the middle of the ring."""
    total = oil + gas
    fig = go.Figure(
        go.Pie(
            labels=["Oil", "Gas & NGL"],
            values=[oil, gas],
            hole=0.68,
            sort=False,
            direction="clockwise",
            marker=dict(colors=[VIOLET, VIOLET_DEEP], line=dict(color=CANVAS, width=2)),
            textinfo="none",
            hovertemplate="%{label}: %{value:,.0f} boe/d (%{percent})<extra></extra>",
        )
    )
    fig.add_annotation(
        text=(
            f"<span style='font-size:13px;color:{MUTED}'>{year_label}</span><br>"
            f"<span style='font-size:26px;color:{TEXT}'><b>{total:,.0f}</b></span><br>"
            f"<span style='font-size:11px;color:{MUTED}'>boe per day</span>"
        ),
        showarrow=False, font=dict(family="'Space Grotesk', sans-serif"),
    )
    fig.update_layout(
        **plotly_layout(
            height=250, hovermode="closest",
            margin=dict(l=6, r=6, t=6, b=6),
            legend=dict(orientation="h", y=-0.02, x=0.5, xanchor="center",
                        font=dict(size=11, color=MUTED)),
        )
    )
    return fig


def margin_gauge(value: float, label: str) -> go.Figure:
    """A percentage shown as a partial ring with the number inside."""
    fig = go.Figure(
        go.Pie(
            values=[value, max(0.0, 1 - value)],
            hole=0.74,
            sort=False,
            direction="clockwise",
            rotation=0,
            marker=dict(colors=[VIOLET, "rgba(255,255,255,0.06)"], line=dict(width=0)),
            textinfo="none",
            hoverinfo="skip",
        )
    )
    fig.add_annotation(
        text=(
            f"<span style='font-size:34px;color:{TEXT}'><b>{value:.0%}</b></span><br>"
            f"<span style='font-size:11px;color:{MUTED}'>{label}</span>"
        ),
        showarrow=False, font=dict(family="'Space Grotesk', sans-serif"),
    )
    fig.update_layout(
        **plotly_layout(height=230, showlegend=False, hovermode=False,
                        margin=dict(l=6, r=6, t=6, b=6))
    )
    return fig


def compare_pair(labels: tuple[str, str], values: tuple[float, float], prefix: str = "$") -> go.Figure:
    """Two bars side by side — the 'May vs Jun' device from the reference."""
    fig = go.Figure(
        go.Bar(
            x=list(labels),
            y=list(values),
            width=0.45,
            marker=dict(color=[VIOLET_DEEP, VIOLET],
                        line=dict(color=VIOLET_LIGHT, width=1)),
            text=[f"{prefix}{v:,.0f}" for v in values],
            textposition="outside",
            textfont=dict(color=TEXT, size=13, family="'Space Grotesk', sans-serif"),
            hovertemplate="%{x}: " + prefix + "%{y:,.0f}<extra></extra>",
        )
    )
    fig.update_layout(
        **plotly_layout(
            height=230, hovermode="closest", showlegend=False,
            margin=dict(l=6, r=6, t=26, b=24),
            xaxis=dict(showgrid=False, linecolor="rgba(0,0,0,0)", ticks="",
                       tickfont=dict(color=MUTED, size=12)),
            yaxis=dict(visible=False, range=[0, max(values) * 1.28]),
        )
    )
    return fig


def trajectory(frame: pd.DataFrame, unit: str, fill: bool = True) -> go.Figure:
    """A single series as a gradient area — used for the headline trend card."""
    actual = frame[frame["period"] == "Actual"]
    forecast = frame[frame["period"] == "Forecast"]
    # Repeat the last reported point so the two segments join without a gap.
    bridge = pd.concat([actual.tail(1), forecast])

    fig = go.Figure()
    fig.add_scatter(
        name="Reported", x=actual["year"], y=actual["value"],
        mode="lines+markers", line=dict(color=VIOLET, width=3, shape="spline"),
        marker=dict(size=7, color=VIOLET, line=dict(color=CANVAS, width=1.5)),
        fill="tozeroy" if fill else None, fillcolor="rgba(169,107,238,0.20)",
        hovertemplate="%{y:,.0f} " + unit + "<extra>Reported</extra>",
    )
    fig.add_scatter(
        name="Projected", x=bridge["year"], y=bridge["value"],
        mode="lines+markers", line=dict(color=VIOLET_GLOW, width=2.5, dash="dot", shape="spline"),
        marker=dict(size=7, color=VIOLET_GLOW, line=dict(color=CANVAS, width=1.5)),
        fill="tozeroy" if fill else None, fillcolor="rgba(217,191,248,0.10)",
        hovertemplate="%{y:,.0f} " + unit + "<extra>Projected</extra>",
    )
    fig.update_layout(**plotly_layout(height=250, yaxis=dict(showgrid=True, gridcolor=GRID,
                                                            tickfont=dict(color=MUTED, size=11))))
    return fig

def production_mix(oil: pd.DataFrame, gas: pd.DataFrame, total: pd.DataFrame) -> go.Figure:
    """Stacked oil vs gas production with the year-on-year growth rate on top."""
    years = total["year"].tolist()
    growth = total["value"].pct_change() * 100

    fig = go.Figure()
    fig.add_bar(
        name="Oil", x=oil["year"], y=oil["value"],
        marker=dict(color=VIOLET, pattern=_pattern(oil["period"])),
        hovertemplate="Oil: %{y:,.0f} barrels per day<extra></extra>",
    )
    fig.add_bar(
        name="Gas & NGL", x=gas["year"], y=gas["value"],
        marker=dict(color=VIOLET_DEEP, pattern=_pattern(gas["period"])),
        hovertemplate="Gas & NGL: %{y:,.0f} boe per day<extra></extra>",
    )
    fig.add_scatter(
        name="Growth vs prior year", x=years, y=growth, yaxis="y2",
        mode="lines+markers", line=dict(color=VIOLET_GLOW, width=2),
        marker=dict(size=6, color=VIOLET_GLOW),
        hovertemplate="Growth vs prior year: %{y:.1f}%<extra></extra>",
    )
    fig.update_layout(
        **plotly_layout(
            height=380, barmode="stack",
            yaxis=dict(title="boe per day", showgrid=True, gridcolor=GRID,
                       tickfont=dict(color=MUTED, size=11), titlefont=dict(color=MUTED, size=11)),
            yaxis2=dict(title="Growth (%)", overlaying="y", side="right", showgrid=False,
                        ticksuffix="%", tickfont=dict(color=MUTED, size=11),
                        titlefont=dict(color=MUTED, size=11)),
        )
    )
    return _forecast_band(fig, years)


def revenue_and_margin(revenue: pd.DataFrame, margin: pd.DataFrame) -> go.Figure:
    """Revenue bars with the EBITDA margin line — growth plus quality."""
    years = revenue["year"].tolist()

    fig = go.Figure()
    fig.add_bar(
        name="Revenue", x=revenue["year"], y=revenue["value"],
        marker=dict(color=_colours(revenue["period"]), pattern=_pattern(revenue["period"])),
        hovertemplate="Revenue: $%{y:,.0f} million<extra></extra>",
    )
    fig.add_scatter(
        name="EBITDA margin", x=margin["year"], y=margin["value"] * 100, yaxis="y2",
        mode="lines+markers", line=dict(color=VIOLET_GLOW, width=2.5),
        marker=dict(size=6), hovertemplate="EBITDA margin: %{y:.1f}% of revenue<extra></extra>",
    )
    fig.update_layout(
        **plotly_layout(
            height=380,
            yaxis=dict(title="$ millions", showgrid=True, gridcolor=GRID,
                       tickfont=dict(color=MUTED, size=11), titlefont=dict(color=MUTED, size=11)),
            yaxis2=dict(title="Margin (%)", overlaying="y", side="right", showgrid=False,
                        range=[0, 100], ticksuffix="%", tickfont=dict(color=MUTED, size=11),
                        titlefont=dict(color=MUTED, size=11)),
        )
    )
    return _forecast_band(fig, years)


def unit_economics(ebitda_per_boe: pd.DataFrame, cost_per_boe: pd.DataFrame) -> go.Figure:
    """What one barrel earns versus what it costs."""
    years = ebitda_per_boe["year"].tolist()

    fig = go.Figure()
    fig.add_bar(
        name="Profit per barrel", x=ebitda_per_boe["year"], y=ebitda_per_boe["value"],
        marker=dict(color=_colours(ebitda_per_boe["period"]),
                    pattern=_pattern(ebitda_per_boe["period"])),
        hovertemplate="Earns $%{y:.2f} per barrel<extra></extra>",
    )
    fig.add_scatter(
        name="Cost per barrel", x=cost_per_boe["year"], y=cost_per_boe["value"],
        mode="lines+markers", line=dict(color=VIOLET_GLOW, width=2.5),
        marker=dict(size=6), hovertemplate="Costs $%{y:.2f} per barrel<extra></extra>",
    )
    fig.update_layout(
        **plotly_layout(height=360, yaxis=dict(title="US$ per barrel", showgrid=True,
                                               gridcolor=GRID, tickfont=dict(color=MUTED, size=11),
                                               titlefont=dict(color=MUTED, size=11)))
    )
    return _forecast_band(fig, years)


def margin_ladder(frames: dict[str, pd.DataFrame]) -> go.Figure:
    """Gross / EBITDA / EBIT / net margins as parallel lines."""
    shades = [VIOLET_GLOW, VIOLET, VIOLET_LIGHT, VIOLET_DEEP]
    fig = go.Figure()
    years: list[str] = []
    for (label, frame), colour in zip(frames.items(), shades):
        years = frame["year"].tolist()
        fig.add_scatter(
            name=label, x=frame["year"], y=frame["value"] * 100,
            mode="lines+markers", line=dict(color=colour, width=2.5), marker=dict(size=6),
            hovertemplate=f"{label}: %{{y:.1f}}% of revenue<extra></extra>",
        )
    fig.update_layout(
        **plotly_layout(height=360, yaxis=dict(title="Share of revenue (%)", ticksuffix="%",
                                               showgrid=True, gridcolor=GRID,
                                               tickfont=dict(color=MUTED, size=11),
                                               titlefont=dict(color=MUTED, size=11)))
    )
    return _forecast_band(fig, years)


def cash_flow_story(fcf: pd.DataFrame, capex: pd.DataFrame, ocf: pd.DataFrame) -> go.Figure:
    """Operating cash in, capital spending out, free cash flow as the result."""
    years = fcf["year"].tolist()

    fig = go.Figure()
    fig.add_bar(
        name="Cash from operations", x=ocf["year"], y=ocf["value"],
        marker=dict(color=VIOLET_DEEP),
        hovertemplate="Cash from operations: $%{y:,.0f} million<extra></extra>",
    )
    fig.add_bar(
        name="Invested in new wells", x=capex["year"], y=capex["value"],
        marker=dict(color="rgba(169,107,238,0.45)"),
        hovertemplate="Capital spending: $%{y:,.0f} million<extra></extra>",
    )
    fig.add_scatter(
        name="Free cash flow", x=fcf["year"], y=fcf["value"],
        mode="lines+markers", line=dict(color=VIOLET_GLOW, width=3),
        marker=dict(size=10, color=[POSITIVE if v >= 0 else NEGATIVE for v in fcf["value"]],
                    line=dict(width=1.5, color=CANVAS)),
        hovertemplate="Free cash flow: $%{y:,.0f} million<extra></extra>",
    )
    fig.add_hline(y=0, line_width=1, line_color=MUTED)
    fig.update_layout(
        **plotly_layout(height=390, barmode="relative",
                        yaxis=dict(title="$ millions", showgrid=True, gridcolor=GRID,
                                   tickfont=dict(color=MUTED, size=11),
                                   titlefont=dict(color=MUTED, size=11)))
    )
    return _forecast_band(fig, years)


def leverage(net_debt: pd.DataFrame, ratio: pd.DataFrame) -> go.Figure:
    """Net debt in dollars, with debt-to-earnings as the reader's yardstick."""
    years = net_debt["year"].tolist()

    fig = go.Figure()
    fig.add_bar(
        name="Net debt", x=net_debt["year"], y=net_debt["value"],

    fig.add_scatter(

        mode="lines+markers", line=dict(color=VIOLET_GLOW, width=2.5), marker=dict(size=6),
        hovertemplate="Debt equals %{y:.2f} years of earnings<extra></extra>",
    )
    fig.add_hline(y=0, line_width=1, line_color=MUTED)
    fig.update_layout(
        **plotly_layout(height=360,
                        yaxis=dict(title="$ millions", showgrid=True, gridcolor=GRID,
                                   tickfont=dict(color=MUTED, size=11),
                                   titlefont=dict(color=MUTED, size=11)),

                                    showgrid=False, tickfont=dict(color=MUTED, size=11),
                                    titlefont=dict(color=MUTED, size=11)))
    )
    return _forecast_band(fig, years)


def dcf_waterfall(dcf: dict) -> go.Figure:
    """Bridge from discounted cash flows to the value of one share."""
    steps = [
        ("Cash flows 2026-2030", dcf["sum_pv_of_fcf_m"], "relative"),
        ("Value beyond 2030", dcf["pv_of_terminal_value_m"], "relative"),
        ("Company value", None, "total"),
        ("Less: net debt", -dcf["less_net_debt_2025a_m"], "relative"),
        ("Value for shareholders", None, "total"),
    ]
    fig = go.Figure(
        go.Waterfall(
            orientation="v",
            measure=[m for _, _, m in steps],
            x=[label for label, _, _ in steps],
            y=[0 if v is None else v for _, v, _ in steps],
            connector=dict(line=dict(color=LINE)),
            increasing=dict(marker=dict(color=VIOLET_DEEP)),
            decreasing=dict(marker=dict(color=NEGATIVE)),
            totals=dict(marker=dict(color=VIOLET)),
            texttemplate="$%{y:,.0f}M",
            textposition="outside",
            textfont=dict(color=TEXT, size=11),
            hovertemplate="%{x}: $%{y:,.0f} million<extra></extra>",
        )
    )
    fig.update_layout(
        **plotly_layout(height=380, hovermode="closest", showlegend=False,
                        yaxis=dict(title="$ millions", showgrid=True, gridcolor=GRID,
                                   tickfont=dict(color=MUTED, size=11),
                                   titlefont=dict(color=MUTED, size=11)))
    )
    return fig


def price_targets(current: float, targets: dict[str, float]) -> go.Figure:
    """The share price today versus each valuation method."""
    labels, values = list(targets.keys()), list(targets.values())
    fig = go.Figure()
    fig.add_bar(
        x=values, y=labels, orientation="h",
        marker=dict(color=[VIOLET_DEEP, VIOLET_LIGHT, VIOLET][: len(labels)]),
        texttemplate="$%{x:,.2f}", textposition="outside",
        textfont=dict(color=TEXT, size=12),
        hovertemplate="%{y}: $%{x:,.2f} per share<extra></extra>", showlegend=False,
    )
    fig.add_vline(
        x=current, line_width=2, line_dash="dash", line_color=VIOLET_GLOW,
        annotation_text=f"Trading today ${current:,.2f}", annotation_position="top",
        annotation_font=dict(color=VIOLET_GLOW, size=11),
    )
    fig.update_layout(
        **plotly_layout(
            height=300, hovermode="closest",
            margin=dict(l=8, r=90, t=30, b=30),

                       tickfont=dict(color=MUTED, size=11), titlefont=dict(color=MUTED, size=11)),
            yaxis=dict(showgrid=False, autorange="reversed", tickfont=dict(color=TEXT, size=12)),
        )
    )
    return fig


def sensitivity_heatmap(grid: pd.DataFrame, current_price: float) -> go.Figure:
    """Value per share across oil-price and discount-rate assumptions."""
    fig = go.Figure(
        go.Heatmap(
            z=grid.values,
            x=[f"{c:.0%}" for c in grid.columns],
            y=[f"${i:,.0f}" for i in grid.index],
            colorscale=PURPLE_SCALE,
            texttemplate="%{z:.0f}",
            textfont=dict(size=11, color=TEXT),
            xgap=2, ygap=2,
            hovertemplate=("Oil %{y}/barrel, discount rate %{x}"
                           "<br>Value per share: $%{z:,.2f}<extra></extra>"),
            colorbar=dict(title=dict(text="$/share", side="right", font=dict(color=MUTED, size=11)),
                          thickness=12, outlinewidth=0, tickfont=dict(color=MUTED, size=10)),
        )
    )
    fig.update_layout(
        **plotly_layout(
            height=380, hovermode="closest",
            xaxis=dict(title="Discount rate (WACC)", showgrid=False,
                       tickfont=dict(color=MUTED, size=11), titlefont=dict(color=MUTED, size=11)),
            yaxis=dict(title="Brent oil price", showgrid=False,
                       tickfont=dict(color=MUTED, size=11), titlefont=dict(color=MUTED, size=11)),
        )
    )
    return fig
